name: rekindle

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rekindle
      POSTGRES_PASSWORD: rekindlepassword
      POSTGRES_DB: rekindledb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekindle -d rekindledb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
