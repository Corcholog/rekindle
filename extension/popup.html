<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom Web Clipper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #0f0f11;
      color: #f4f4f5;
      font-size: 13px;
      line-height: 1.4;
      padding: 16px;
      border: 1px solid #27272a;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1f1f23;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 700;
      font-size: 13px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
      color: #fafafa;
    }

    .server-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #a1a1aa;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #71717a;
    }

    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .status-dot.offline {
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
    }

    .queue-card {
      margin-bottom: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .queue-info {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .queue-sync-btn {
      background: #f59e0b;
      color: #09090b;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    .queue-sync-btn:hover {
      background: #fbbf24;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a1a1aa;
      margin-bottom: 4px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #f4f4f5;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #f59e0b;
    }

    textarea {
      resize: vertical;
      min-height: 52px;
      max-height: 100px;
      font-family: inherit;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      flex: 1;
      background: #f59e0b;
      color: #09090b;
    }

    .btn-primary:hover {
      background: #fbbf24;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #27272a;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
    }

    .btn-secondary:hover {
      background: #3f3f46;
      color: #fff;
    }

    .offline-hint {
      font-size: 11px;
      color: #a1a1aa;
      margin-top: 6px;
      line-height: 1.35;
      display: none;
    }

    .offline-hint.visible {
      display: block;
    }

    .feedback {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }

    .feedback.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
    }

    .feedback.warning {
      display: block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #f59e0b;
      color: #fbbf24;
    }

    .feedback.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">✦</div>
      <span class="brand-name">Loom Clipper</span>
    </div>
    <div class="server-status" id="server-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Comprobando...</span>
    </div>
  </div>

  <div id="queue-banner" class="queue-card" style="display: none;">
    <div class="queue-info">
      <span>⏳</span>
      <span id="queue-msg">0 recortes en cola</span>
    </div>
    <button type="button" id="btn-sync-queue" class="queue-sync-btn" style="display: none;">Sincronizar</button>
  </div>

  <form id="clip-form">
    <div class="form-group">
      <label for="clip-title">Título</label>
      <input type="text" id="clip-title" placeholder="Título del artículo..." required autocomplete="off">
    </div>

    <div class="form-group">
      <label for="clip-url">URL</label>
      <input type="text" id="clip-url" placeholder="https://..." required autocomplete="off">
    </div>

    <div class="form-group">
      <label for="clip-selection">Cita o Selección (Opcional)</label>
      <textarea id="clip-selection" placeholder="Texto destacado o anotación rápida..."></textarea>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary" id="btn-submit">
        <span id="btn-text">Guardar en Loom</span>
      </button>
      <a href="http://localhost:3000" target="_blank" class="btn btn-secondary" title="Abrir taller de Loom">Abrir</a>
    </div>

    <p class="offline-hint" id="offline-hint">
      ✦ Loom está desconectado. Tu recorte se guardará en tu cola local y se enviará automáticamente tan pronto como Loom inicie.
    </p>

    <div class="feedback" id="feedback"></div>
  </form>

  <script src="popup.js"></script>
</body>
</html>
