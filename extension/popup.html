<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekindle Clipper</title>
  <style>
    /* Same palette as the web app (web/src/styles.css): ash paper in light, coal in dark */
    :root {
      color-scheme: light dark;
      --bg: #f6f7f8; --surface: #e7eaec; --line: rgb(29 33 36 / 0.14);
      --ink: #1b1e21; --ink-2: #4b5258; --ink-3: #6c747a;
      --ember: #b8410f; --ember-ink: #ffffff; --ember-soft: rgb(184 65 15 / 0.09);
      --ok: #2c7046; --danger: #a8281c; --warn: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1714; --surface: #231f1b; --line: rgb(239 228 216 / 0.12);
        --ink: #efe6dc; --ink-2: #b7aa9d; --ink-3: #8c8075;
        --ember: #f07a30; --ember-ink: #1a1714; --ember-soft: rgb(240 122 48 / 0.12);
        --ok: #86b894; --danger: #e6786b; --warn: #e3b25c;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); font-size: 13px; line-height: 1.45; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-icon { width: 22px; height: 22px; }
    .brand-name { font-weight: 700; font-size: 14px; }
    .server-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
    .status-dot.online { background: var(--ok); }
    .status-dot.offline { background: var(--warn); }
    .queue-card { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--ember-soft); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; color: var(--ink); }
    .queue-info { display: flex; align-items: center; gap: 6px; }
    .queue-sync-btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 5px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
    .form-group { display: grid; gap: 4px; margin-bottom: 10px; }
    label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
    input, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 7px 9px; font: inherit; }
    textarea { min-height: 64px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--ember); outline-offset: 1px; }
    .actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; padding: 8px 12px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid transparent; }
    .btn-primary { flex: 1; background: var(--ember); color: var(--ember-ink); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }
    .btn-secondary { border-color: var(--line); background: var(--bg); color: var(--ink); }
    .btn:focus-visible, .queue-sync-btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
    .offline-hint { display: none; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
    .offline-hint.visible { display: block; }
    .feedback { margin-top: 10px; font-size: 12px; min-height: 1em; }
    .feedback.success { color: var(--ok); }
    .feedback.warning { color: var(--warn); }
    .feedback.error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img class="brand-icon" src="icons/icon-48.png" alt="">
      <span class="brand-name">Rekindle Clipper</span>
    </div>
    <div class="server-status" id="server-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text" data-i18n="checking">Checking...</span>
    </div>
  </div>

  <div id="queue-banner" class="queue-card" style="display: none;">
    <div class="queue-info">
      <span>⏳</span>
      <span id="queue-msg" data-i18n="queueEmpty">0 clips queued</span>
    </div>
    <button type="button" id="btn-sync-queue" class="queue-sync-btn" style="display: none;" data-i18n="sync">Sync</button>
  </div>

  <form id="clip-form">
    <div class="form-group">
      <label for="clip-title" data-i18n="titleLabel">Title</label>
      <input type="text" id="clip-title" placeholder="Article title..." data-i18n-placeholder="titlePlaceholder" required autocomplete="off">
    </div>

    <div class="form-group">
      <label for="clip-url">URL</label>
      <input type="text" id="clip-url" placeholder="https://..." required autocomplete="off">
    </div>

    <div class="form-group">
      <label for="clip-selection" data-i18n="selectionLabel">Quote or selection (optional)</label>
      <textarea id="clip-selection" placeholder="Highlighted text or a quick note..." data-i18n-placeholder="selectionPlaceholder"></textarea>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary" id="btn-submit">
        <span id="btn-text" data-i18n="saveToRekindle">Save to Rekindle</span>
      </button>
      <a href="http://localhost:3000" target="_blank" class="btn btn-secondary" title="Open Rekindle" data-i18n-title="openTitle" data-i18n="open">Open</a>
    </div>

    <p class="offline-hint" id="offline-hint" data-i18n="offlineHint">✦ Rekindle is offline.</p>

    <div class="feedback" id="feedback"></div>
  </form>

  <script src="popup.js"></script>
</body>
</html>
