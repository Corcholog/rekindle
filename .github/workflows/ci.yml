name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (the tag is in the comment)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The lowest Node version package.json supports
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The UI tests load the built bundle (web/dist)
      - run: pnpm build:web
      # No Ollama, no API keys: tests/helpers/fakeAi.ts stands in for the models, and the
      # integration tests start throwaway pgvector databases with Testcontainers (Docker).
      - run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
